<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cesta - AliMarket</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
.header{position:fixed;top:0;left:0;width:100%;background:#fff;z-index:9999;padding:18px 70px 28px}
.header-top{display:flex;align-items:center;gap:22px}
.logo{font-family:Georgia,serif;font-size:43px;font-weight:bold;color:#b40000;text-decoration:none;letter-spacing:3px}
.search-box{flex:1;height:43px;border:2px solid #777;border-radius:30px;display:flex;align-items:center;padding:0 15px;gap:10px;max-width:720px}
.search-box input{border:none;outline:none;width:100%;font-size:16px;background:transparent}
.search-box i{color:#555;font-size:18px}
.header-icons{display:flex;align-items:center;gap:24px}
.header-icons a{text-decoration:none;color:#000;font-weight:900;display:flex;align-items:center;gap:9px;font-size:19px}
.header-icons i{font-size:30px}
.promo-bar{margin-top:18px;display:flex;align-items:center;gap:12px;padding-left:48px}
.promo-bar a{min-width:165px;background:#d8d8d8;color:#000;text-decoration:none;font-weight:900;text-align:center;padding:10px 18px;border-radius:18px;font-size:14px}
.promo-bar .cat{background:#fa8d94;display:flex;align-items:center;justify-content:center;gap:10px}
.categoria-hover{position:relative}
.hover-full{position:fixed;top:145px;left:0;width:100%;height:calc(100vh - 145px);background:#d9d9d9;z-index:9998;padding:25px 70px;opacity:0;visibility:hidden;transform:translateY(15px);transition:.25s;overflow:auto}
.categoria-hover:hover .hover-full,.hover-full:hover{opacity:1;visibility:visible;transform:translateY(0)}
.cat-page{width:100%;max-width:1500px;margin:auto}
.cat-layout{display:grid;grid-template-columns:290px 1fr;gap:24px}
.cat-sidebar{background:#fff;border-radius:16px;padding:17px 18px;min-height:670px}
.cat-item{height:55px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:21px;font-weight:600;cursor:pointer;padding:0 8px;border-radius:12px}
.cat-item:hover,.cat-item.active{background:#fff1f1;color:#e00000}
.cat-left{display:flex;align-items:center;gap:12px}
.cat-icon{width:28px;text-align:center;font-size:23px}
.cat-content{padding-top:0}
.cat-banner{height:132px;background:linear-gradient(90deg,#4b0000,#e50000,#ff2727);border-radius:14px;display:flex;align-items:center;gap:25px;padding:25px 32px;color:#fff;margin-bottom:20px}
.cat-banner .banner-icon{font-size:66px}
.cat-banner h1{font-size:36px;margin-bottom:8px}
.cat-banner p{font-size:18px;font-weight:700}
.cat-title-row{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #fff;padding:0 8px 15px;margin-bottom:20px}
.cat-title-row h2{font-size:34px;font-weight:900}
.cat-title-row a{color:#e33333;text-decoration:none;font-size:19px;font-weight:700}
.subcat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.subcat-card{height:190px;background:#fff;border:2px solid #fff;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.subcat-card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.subcat-img{height:127px;background:#cfcfcf;display:flex;align-items:center;justify-content:center}
.subcat-img img{width:90px;height:90px;object-fit:contain}
.subcat-card h3{height:63px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px}
.user-menu-wrap{position:relative}
.user-menu-trigger{cursor:pointer}
.user-dropdown{
  position:absolute;
  top:calc(100% + 14px);
  right:0;
  width:360px;
  max-height:610px;
  overflow-y:auto;
  background:#fff;
  border:1px solid #e3e3e3;
  border-radius:20px;
  box-shadow:0 12px 35px rgba(0,0,0,.18);
  padding:18px 18px 16px;
  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:.2s ease;
  z-index:10050;
}
.user-menu-wrap:hover .user-dropdown,
.user-menu-wrap.open .user-dropdown{
  opacity:1;
  visibility:visible;
  transform:none;
}
.user-dropdown::before{
  content:"";
  position:absolute;
  top:-10px;
  right:34px;
  width:18px;
  height:18px;
  background:#fff;
  border-left:1px solid #e3e3e3;
  border-top:1px solid #e3e3e3;
  transform:rotate(45deg);
}
.user-login-btn{
  display:block;
  width:100%;
  padding:18px 20px;
  border:0;
  border-radius:40px;
  background:#111827;
  color:#fff;
  font-size:22px;
  font-weight:800;
  text-align:center;
  cursor:pointer;
}
.user-register{
  display:block;
  text-align:center;
  margin:12px 0 18px;
  font-size:18px;
  font-weight:700;
  color:#222;
}
.user-divider{height:1px;background:#e5e5e5;margin:6px 0 14px}
.user-menu-list{display:flex;flex-direction:column}
.user-menu-item{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 10px;
  color:#222;
  text-decoration:none;
  font-size:20px;
  border-radius:10px;
  transition:.18s;
}
.user-menu-item:hover{background:#f4f4f4}
.user-menu-item i{
  width:26px;
  text-align:center;
  font-size:22px;
  color:#333;
}
.user-dropdown::-webkit-scrollbar{width:8px}
.user-dropdown::-webkit-scrollbar-thumb{background:#7c7c7c;border-radius:10px}
.user-dropdown::-webkit-scrollbar-track{background:#f2f2f2;border-radius:10px}

:root{--red:#e60023;--line:#e6e6e6;--muted:#6b6b6b}
body{background:#f4f4f4;color:#181818;padding-top:155px;padding-bottom:40px}
.cart-page{width:min(1500px,94%);margin:26px auto;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:26px}
.cart-main,.cart-summary{background:#fff;border-radius:14px}
.cart-main{padding:26px}
.cart-title{font-size:32px;margin:0 0 22px}
.cart-toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px}
.check-label{display:flex;align-items:center;gap:10px;font-size:16px;cursor:pointer}
.check-label input,.item-check{width:20px;height:20px;accent-color:var(--red)}
.delete-selected{border:0;background:transparent;color:#1c4a8b;font-weight:700;cursor:pointer;text-decoration:underline}
.cart-store{margin-top:22px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.store-head{padding:16px 18px;background:#fafafa;display:flex;align-items:center;gap:12px;font-weight:800}
.store-badge{background:#f0b84a;color:#5d4200;padding:4px 8px;border-radius:5px;font-size:12px}
.shipping-note{padding:10px 18px;color:#8a4b00;background:#fff9ee;font-size:14px}
.cart-item{display:grid;grid-template-columns:auto 120px minmax(0,1fr) auto;gap:18px;padding:20px 18px;border-top:1px solid var(--line);align-items:start}
.cart-item img{width:120px;height:120px;object-fit:contain;border-radius:8px;background:#f7f7f7;border:1px solid #eee}
.item-name{font-size:17px;line-height:1.4;margin-bottom:8px}
.item-variant{color:var(--muted);font-size:14px;margin-bottom:10px}
.item-price{font-size:21px;font-weight:900}
.item-actions{display:flex;align-items:center;gap:10px;margin-top:14px}
.icon-btn{border:0;background:transparent;font-size:18px;cursor:pointer;color:#555}
.qty-control{display:flex;align-items:center;border:1px solid #ccc;border-radius:7px;overflow:hidden}
.qty-control button{width:36px;height:36px;border:0;background:#f4f4f4;cursor:pointer;font-size:18px}
.qty-control input{width:44px;height:36px;border:0;text-align:center;font-weight:800}
.cart-summary{padding:26px;position:sticky;top:170px;height:max-content}
.cart-summary h2{font-size:28px;margin:0 0 24px}
.summary-row{display:flex;justify-content:space-between;gap:20px;margin:16px 0;font-size:18px}
.summary-total{font-size:25px;font-weight:900;padding-top:16px;border-top:1px solid var(--line)}
.checkout-btn{width:100%;border:0;border-radius:28px;background:linear-gradient(90deg,#e73554,#b70d2d);color:#fff;padding:16px;font-size:19px;font-weight:900;cursor:pointer;margin-top:18px}
.checkout-btn:disabled{opacity:.45;cursor:not-allowed}
.security-box{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.security-box h3{font-size:20px;margin:0 0 8px}
.security-box p{color:var(--muted);line-height:1.5;font-size:14px}
.empty-cart{text-align:center;padding:60px 20px}
.empty-cart i{font-size:65px;color:#aaa}
.empty-cart h2{margin:18px 0 8px}
.continue-shopping{display:inline-block;margin-top:15px;padding:12px 22px;background:#111;color:#fff;border-radius:24px;text-decoration:none;font-weight:800}
.cart-count-badge{background:#111;color:#fff;border-radius:12px;padding:2px 7px;font-size:12px;margin-left:2px}
.toast{position:fixed;right:22px;bottom:22px;background:#111;color:#fff;padding:13px 18px;border-radius:8px;opacity:0;transform:translateY(10px);transition:.2s;z-index:11000}
.toast.show{opacity:1;transform:none}
@media(max-width:1000px){
  .cart-page{grid-template-columns:1fr}
  .cart-summary{position:static}
}
@media(max-width:700px){
  body{zoom:75%;padding-top:220px}
  .cart-page{width:100%;margin:0;padding:12px}
  .cart-main,.cart-summary{border-radius:10px;padding:16px}
  .cart-item{grid-template-columns:auto 92px 1fr;gap:10px;padding:16px 8px}
  .cart-item img{width:92px;height:92px}
  .item-side{grid-column:3}
  .cart-toolbar{align-items:flex-start;flex-direction:column}
}


.mobile-cart-title{display:none}

@media(max-width:700px){
  .header{
    display:none!important;
  }

  body{
    padding-top:0!important;
  }

  .desktop-cart-title{
    display:none!important;
  }

  .mobile-cart-title{
    display:inline!important;
  }
}


/* Menú inferior móvil igual al index */
.mobile-bottom{display:none}

@media(max-width:768px){
  body{
    padding-bottom:104px!important;
  }

  .mobile-bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:92px;
    background:#fff;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:7px 4px 4px;
    border-top:1px solid #ddd;
    box-shadow:0 -3px 10px rgba(0,0,0,.08);
    z-index:9999;
  }

  .mobile-bottom a{
    color:#222;
    text-decoration:none;
    font-size:28px;
    min-width:62px;
    height:72px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
  }

  .mobile-bottom a::after{
    font-size:13px;
    font-family:Arial,sans-serif;
  }

  .mobile-bottom a:nth-child(1)::after{content:"Inicio"}
  .mobile-bottom a:nth-child(2)::after{content:"Mensajes"}
  .mobile-bottom a:nth-child(4){
    color:#d00000;
  }
  .mobile-bottom a:nth-child(4)::after{content:"Cesta"}
  .mobile-bottom a:nth-child(5)::after{content:"Usuario"}

  .mobile-bottom .discount{
    width:72px;
    min-width:72px;
    height:72px;
    border-radius:50%;
    background:#e5243f;
    color:#fff;
    font-size:23px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .mobile-bottom .discount::after{content:""!important}
}

   HEADER EXACTAMENTE IGUAL AL DETALLE DEL PRODUCTO
========================================================= */

  left:auto !important;
  width:100% !important;
  z-index:9999 !important;

  padding:18px 2.2% 10px !important;
}

.desktop-header .logo{

  color:#c60020 !important;

  letter-spacing:-2px !important;

}

.desktop-header .search-box{
  width:100% !important;
  max-width:none !important;
  height:50px !important;
  border:2px solid #777 !important;
  border-radius:28px !important;
  display:flex !important;
  align-items:center !important;
  gap:12px !important;
  padding:0 18px !important;

.desktop-header .search-box input{

}

.desktop-header .search-box i{

}

.desktop-header .header-icons{

}

.desktop-header .header-icons a{

.desktop-header .header-icons i{

}

.desktop-header .promo{
  display:flex !important;

}

.desktop-header .promo::-webkit-scrollbar{

}

.desktop-header .promo a{
  min-width:0 !important;
  white-space:nowrap !important;

.desktop-header .promo .category{

  color:#bc001d !important;
  border-radius:8px !important;
  padding:14px 25px !important;
  display:flex !important;

  justify-content:center !important;

}

/* El header sticky ocupa su propio espacio: se elimina el espacio
   que usaba el header fijo anterior del carrito. */
body{
  padding-top:0 !important;
}

/* La tarjeta resumen se mantiene debajo del nuevo header. */
.cart-summary{
  top:175px !important;
}

@media(max-width:1250px){
  .desktop-header .header-row{
    gap:20px !important;
  }

  .desktop-header .header-icons{
    gap:16px !important;
  }
}

@media(max-width:1050px){
  .desktop-header .header-row{
    grid-template-columns:auto 1fr !important;
  }

  .desktop-header .header-icons{
    grid-column:1/-1 !important;
    justify-content:flex-end !important;
  }
}

@media(max-width:760px){
  .desktop-header{
    display:none !important;
  }

  body{
    padding-top:0 !important;
  }
}


/* =========================================================
   ESTADO DE CARRITO VACÍO IGUAL A LA IMAGEN
========================================================= */
.empty-cart{
  min-height:620px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:70px 20px;
  background:#fff;
}

.empty-cart i{
  font-size:105px;
  color:#2f3a4b;
  margin-bottom:28px;
}

.empty-cart h2{
  margin:0 0 14px;
  font-size:44px;
  line-height:1.15;
  color:#273142;
  font-weight:900;
}

.empty-cart p{
  margin:0;
  font-size:24px;
  color:#6f7785;
}

.continue-shopping{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:330px;
  min-height:72px;
  margin-top:34px;
  padding:18px 34px;
  background:#273142;
  color:#fff;
  border-radius:40px;
  text-decoration:none;
  font-size:25px;
  font-weight:900;
  transition:.2s;
}

.continue-shopping:hover{
  background:#111827;
  transform:translateY(-2px);
}

@media(max-width:700px){
  .empty-cart{
    min-height:70vh;
    padding:50px 18px;
  }

  .empty-cart i{
    font-size:88px;
  }

  .empty-cart h2{
    font-size:37px;
  }

  .empty-cart p{
    font-size:21px;
  }

  .continue-shopping{
    min-width:280px;
    min-height:66px;
    font-size:22px;
  }
}


/* ESTADO VACÍO VISIBLE A PANTALLA COMPLETA */
.cart-page.empty-mode{
  display:block !important;
  width:min(1500px,94%) !important;
}

.cart-page.empty-mode .cart-main{
  width:100% !important;
  min-height:680px !important;
}

.cart-page.empty-mode .cart-toolbar,
.cart-page.empty-mode .cart-summary{
  display:none !important;
}

.cart-page.empty-mode .empty-cart{
  width:100% !important;
  min-height:590px !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
  text-align:center !important;
  padding:70px 20px !important;
}

.cart-page.empty-mode .empty-cart i{
  display:block !important;
  font-size:105px !important;
  color:#2f3a4b !important;
  margin-bottom:26px !important;
}

.cart-page.empty-mode .empty-cart h2{
  display:block !important;
  margin:0 0 14px !important;
  font-size:44px !important;
  line-height:1.15 !important;
  color:#273142 !important;
  font-weight:900 !important;
}

.cart-page.empty-mode .empty-cart p{
  display:block !important;
  margin:0 !important;
  font-size:24px !important;
  color:#6f7785 !important;
}

.cart-page.empty-mode .continue-shopping{
  display:inline-flex !important;

@media(max-width:700px){
  .cart-page.empty-mode{
    width:100% !important;
    padding:12px !important;
  }

  .cart-page.empty-mode .cart-main{
    min-height:72vh !important;
  }

  .cart-page.empty-mode .empty-cart{
    min-height:68vh !important;
    padding:45px 15px !important;
  }

  .cart-page.empty-mode .empty-cart i{

  }

  line-height:1 !important;

  margin-bottom:26px !important;
}

@media(max-width:700px){
  .empty-cart-icon{
    font-size:88px !important;
  }
}

</style>
</head>
<body>
<header class="desktop-header">
<div class="header-row"><a class="logo" href="index.html">AliMarket</a><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input placeholder="Buscar productos"><i class="fa-solid fa-microphone"></i></div><div class="header-icons"><a href="#"><i class="fa-regular fa-heart"></i> Favorito</a><a href="carrito.html"><i class="fa-solid fa-cart-shopping"></i> Cesta</a><a href="#"><i class="fa-regular fa-user"></i> Usuario</a></div></div>
<nav class="promo"><a class="category" href="#"><i class="fa-solid fa-bars"></i> Categorías</a><a href="#">Ofertas promocionales</a><a href="#">Nuevos</a><a href="#">Más vendidos</a><a href="#">Cupones</a><a href="#">Envío gratis</a></nav>
</header>
<main class="cart-page">
  <section class="cart-main">
    <h1 class="cart-title"><span class="desktop-cart-title">Cesta</span><span class="mobile-cart-title">Carrito</span> (<span id="cartCount">0</span>)</h1>
    <div class="cart-toolbar">
      <label class="check-label"><input type="checkbox" id="selectAll"> Seleccionar todos los artículos</label>
      <button class="delete-selected" id="deleteSelected">Borrar artículos seleccionados</button>
    </div>
    <div id="cartContent"></div>
  </section>

  <aside class="cart-summary">
    <h2>Resumen</h2>
    <div class="summary-row"><span>Subtotal</span><strong id="subtotal">RD$ 0.00</strong></div>
    <div class="summary-row"><span>Envío</span><strong id="shipping">RD$ 0.00</strong></div>
    <div class="summary-row summary-total"><span>Estimación total</span><strong id="total">RD$ 0.00</strong></div>
    <button class="checkout-btn" id="checkoutBtn" disabled>Continuar (0)</button>
    <div class="security-box">
      <h3><i class="fa-solid fa-shield-halved"></i> Seguridad y privacidad</h3>
      <p>Pagos seguros y protección de tus datos personales durante la compra.</p>
    </div>
  </aside>
</main>

<nav class="mobile-bottom">
  <a href="index.html"><i class="fa-solid fa-house"></i></a>
  <a href="mensajes.html"><i class="fa-solid fa-comments"></i></a>
  <a href="#" class="discount">20%</a>
  <a href="carrito.html"><i class="fa-solid fa-cart-shopping"></i></a>
  <a href="usuario.html"><i class="fa-solid fa-user"></i></a>
</nav>

<div class="toast" id="toast"></div>

<script>
const CART_KEY='carritoAliMarket';
const $=selector=>document.querySelector(selector);
let cart=[];
let selected=new Set();

function readCart(){
  try{
    const value=JSON.parse(localStorage.getItem(CART_KEY)||'[]');
    return Array.isArray(value)?value:[];
  }catch(error){
    console.error(error);
    return [];
  }
}
function saveCart(){
  localStorage.setItem(CART_KEY,JSON.stringify(cart));
}
function money(value,currency='DOP'){
  const code=(currency||'DOP').split(' ')[0];
  const symbol=code==='DOP'?'RD$':code==='EUR'?'€':'US$';
  return symbol+' '+Number(value||0).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function toast(message){
  const box=$('#toast');
  box.textContent=message;
  box.classList.add('show');
  setTimeout(()=>box.classList.remove('show'),1800);
}
function shippingFor(item){
  return Number(item.shipping)||Math.max(0,Math.round((Number(item.weight)||0.5)*160));
}
function render(){
  cart=readCart();
  const content=$('#cartContent');
  $('#cartCount').textContent=cart.reduce((sum,item)=>sum+(Number(item.cantidad)||1),0);

  if(!cart.length){
    content.innerHTML=`<div class="empty-cart">
      <i class="fa-solid fa-cart-shopping"></i>
      <h2>Tu cesta está vacía</h2>
      <p>Agrega productos para comenzar tu compra.</p>
      <a class="continue-shopping" href="index.html">Seguir comprando</a>
    </div>`;
    selected.clear();
    updateSummary();
    return;
  }

  content.innerHTML=`<div class="cart-store">
    <div class="store-head"><span class="store-badge">Choice</span> Enviado por AliMarket</div>
    <div class="shipping-note">Compra más productos de la tienda para aprovechar mejor el costo de envío.</div>
    ${cart.map((item,index)=>{
      const id=String(item.id||index);
      const variant=[item.variant,item.size].filter(Boolean).join(' · ');
      return `<article class="cart-item" data-index="${index}">
        <input class="item-check" type="checkbox" data-id="${id}" ${selected.has(id)?'checked':''}>
        <img src="${item.image||'https://via.placeholder.com/150?text=Producto'}" alt="${item.name||'Producto'}">
        <div>
          <div class="item-name">${item.name||'Producto sin nombre'}</div>
          <div class="item-variant">${variant||'Variante estándar'}</div>
          <div class="item-price">${money(item.price,item.currency)}</div>
          <div class="item-actions">
            <button class="icon-btn favorite-btn" title="Favorito"><i class="fa-regular fa-heart"></i></button>
            <button class="icon-btn remove-btn" title="Eliminar"><i class="fa-regular fa-trash-can"></i></button>
          </div>
        </div>
        <div class="item-side">
          <div class="qty-control">
            <button class="minus">−</button>
            <input value="${Number(item.cantidad)||1}" readonly>
            <button class="plus">+</button>
          </div>
        </div>
      </article>`;
    }).join('')}
  </div>`;

  content.querySelectorAll('.item-check').forEach(input=>input.onchange=()=>{
    input.checked?selected.add(input.dataset.id):selected.delete(input.dataset.id);
    updateSummary();
  });

  content.querySelectorAll('.cart-item').forEach(row=>{
    const index=Number(row.dataset.index);
    row.querySelector('.minus').onclick=()=>{
      cart[index].cantidad=Math.max(1,(Number(cart[index].cantidad)||1)-1);
      saveCart();render();
    };
    row.querySelector('.plus').onclick=()=>{
      cart[index].cantidad=(Number(cart[index].cantidad)||1)+1;
      saveCart();render();
    };
    row.querySelector('.remove-btn').onclick=()=>{
      selected.delete(String(cart[index].id||index));
      cart.splice(index,1);saveCart();render();toast('Artículo eliminado');
    };
    row.querySelector('.favorite-btn').onclick=()=>toast('Agregado a la lista de deseos');
  });

  updateSummary();
}
function updateSummary(){
  const chosen=cart.filter((item,index)=>selected.has(String(item.id||index)));
  const subtotal=chosen.reduce((sum,item)=>sum+(Number(item.price)||0)*(Number(item.cantidad)||1),0);
  const shipping=chosen.reduce((sum,item)=>sum+shippingFor(item),0);
  $('#subtotal').textContent=money(subtotal,'DOP');
  $('#shipping').textContent=money(shipping,'DOP');
  $('#total').textContent=money(subtotal+shipping,'DOP');
  $('#checkoutBtn').textContent=`Continuar (${chosen.length})`;
  $('#checkoutBtn').disabled=!chosen.length;
  $('#selectAll').checked=cart.length>0&&chosen.length===cart.length;
}
$('#selectAll').onchange=event=>{
  selected.clear();
  if(event.target.checked)cart.forEach((item,index)=>selected.add(String(item.id||index)));
  render();
};
$('#deleteSelected').onclick=()=>{
  if(!selected.size){toast('Selecciona uno o más artículos');return;}
  cart=cart.filter((item,index)=>!selected.has(String(item.id||index)));
  selected.clear();saveCart();render();toast('Artículos eliminados');
};
$('#checkoutBtn').onclick=()=>{
  const chosen=cart.filter((item,index)=>selected.has(String(item.id||index)));
  localStorage.setItem('checkoutAliMarket',JSON.stringify(chosen));
  location.href='checkout.html';
};

const userMenuWrap=document.getElementById('userMenuWrap');
const userMenuTrigger=document.getElementById('userMenuTrigger');
if(userMenuWrap&&userMenuTrigger){
  userMenuTrigger.addEventListener('click',event=>{
    if(window.innerWidth<=768){
      event.preventDefault();
      userMenuWrap.classList.toggle('open');
    }
  });
  document.addEventListener('click',event=>{
    if(!userMenuWrap.contains(event.target))userMenuWrap.classList.remove('open');
  });
}
render();
</script>
</body>
</html>
