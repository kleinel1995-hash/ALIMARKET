<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajes - AliMarket</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
:root{--red:#e5243f;--line:#e7e7e7;--text:#151515;--muted:#777}
body{background:#f4f4f4;color:var(--text);padding-bottom:92px}
button,input{font:inherit}
a{text-decoration:none;color:inherit}

.app{width:min(100%,760px);margin:auto;min-height:100vh;background:#fff}
.top{position:sticky;top:0;z-index:20;background:#fff;padding:18px 22px 14px;border-bottom:1px solid #eee}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:Georgia,serif;color:#b40000;font-size:42px;font-weight:900}
.user-btn{width:46px;height:46px;border:0;background:#fff;font-size:35px;cursor:pointer}
.search{margin-top:18px;height:58px;border-radius:30px;background:#f3f3f3;display:flex;align-items:center;gap:12px;padding:0 20px}
.search i{font-size:24px;color:#555}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:19px}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:22px 18px 18px;border-bottom:1px solid var(--line)}
.quick-item{text-align:center;cursor:pointer}
.quick-icon{width:72px;height:72px;border-radius:50%;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.quick-item:nth-child(1) .quick-icon{background:linear-gradient(135deg,#ff6f84,#ff9da9)}
.quick-item:nth-child(2) .quick-icon{background:linear-gradient(135deg,#2487ff,#5ba5ff)}
.quick-item:nth-child(3) .quick-icon{background:linear-gradient(135deg,#ffb51b,#ffc94a)}
.quick-item:nth-child(4) .quick-icon{background:linear-gradient(135deg,#7d4bea,#9d72f4)}
.quick-item span{display:block;font-weight:800;font-size:15px}

.conversation-list{background:#fff}
.conversation{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.avatar{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f1f1f1;font-size:22px;font-weight:900}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.choice{background:#ffe882;font-style:italic;font-size:18px}
.avatar.mi{background:#ff5b00;color:#fff;font-size:28px}
.avatar.bell{background:#2487ff;color:#fff;font-size:31px}
.avatar.support{background:#7d4bea;color:#fff;font-size:31px}
.conv-name{font-size:20px;font-weight:900;display:flex;align-items:center;gap:7px}
.verified{color:#e60023;font-size:16px}
.preview{margin-top:6px;color:#555;font-size:16px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.conv-side{text-align:right;align-self:start;color:#777;font-size:15px;min-width:50px}
.badge{margin:15px 0 0 auto;width:28px;height:28px;border-radius:50%;background:#e60023;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}

.screen{display:none}
.screen.active{display:block}

.chat-header{position:sticky;top:0;z-index:25;background:#fff;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:14px 12px;border-bottom:1px solid var(--line)}
.chat-header button{width:44px;height:44px;border:0;background:#fff;font-size:29px;cursor:pointer}
.chat-title{text-align:center}
.chat-title h2{font-size:24px}
.online{color:#666;margin-top:5px}
.online::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#4dcc35;margin-right:8px}

.order-card{margin:14px 18px;padding:16px;border:1px solid #ddd;border-radius:18px;display:grid;grid-template-columns:135px 1fr auto;gap:16px;align-items:center}
.order-card img{width:135px;height:135px;object-fit:contain;border-radius:14px;background:#f4f4f4}
.order-card h3{font-size:21px;margin-bottom:13px}
.order-price{color:#e60023;font-size:21px;font-weight:900;margin-bottom:13px}
.order-code{color:#666;font-size:17px}
.order-card i{font-size:26px;color:#777}

.chat-body{padding:20px 18px 145px;min-height:calc(100vh - 180px);background:#fff}
.msg-row{display:flex;gap:12px;margin:18px 0;align-items:flex-start}
.msg-row.me{justify-content:flex-end}
.msg-avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:0 0 48px}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.bubble-wrap{max-width:72%}
.bubble{padding:16px 18px;border-radius:18px;background:#f1f1f1;font-size:18px;line-height:1.55;white-space:pre-wrap}
.me .bubble{background:#ffdfe5}
.msg-time{font-size:14px;color:#777;margin-top:6px}
.me .msg-time{text-align:right}
.chat-input{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;width:min(100%,760px);background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:48px 1fr 58px;gap:10px;align-items:center;z-index:30}
.chat-input button{border:0;background:#fff;font-size:29px;cursor:pointer}
.chat-input input{height:54px;border:1px solid #ddd;border-radius:28px;padding:0 18px;font-size:17px;outline:none}
.chat-input .send{width:54px;height:54px;border-radius:50%;background:var(--red);color:#fff}

.notifications-header{position:sticky;top:0;background:#fff;z-index:25;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:15px 12px;border-bottom:1px solid var(--line)}
.notifications-header button{width:44px;height:44px;border:0;background:#fff;font-size:28px}
.notifications-header h2{text-align:center}
.notice{display:grid;grid-template-columns:74px 1fr 14px;gap:16px;align-items:center;padding:20px;border-bottom:1px solid var(--line)}
.notice-icon{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px}
.notice:nth-child(1) .notice-icon{background:#ffe0e4;color:#e60023}
.notice:nth-child(2) .notice-icon{background:#fff1d0;color:#ff9d00}
.notice:nth-child(3) .notice-icon{background:#dfeeff;color:#1c78ff}
.notice:nth-child(4) .notice-icon{background:#dff7e8;color:#06ad54}
.notice:nth-child(5) .notice-icon{background:#efdfff;color:#9a35e5}
.notice:nth-child(6) .notice-icon{background:#dcecff;color:#166fd9}
.notice h3{font-size:19px;margin-bottom:5px}
.notice p{color:#555;line-height:1.4}
.notice small{display:block;color:#888;margin-top:6px}
.dot{width:12px;height:12px;background:#e60023;border-radius:50%}

.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);height:92px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;z-index:40}
.bottom a{height:72px;min-width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:27px;color:#222}
.bottom a span{font-size:13px}
.bottom .active{color:var(--red)}
.bottom .discount{width:72px;min-width:72px;height:72px;border-radius:50%;background:var(--red);color:#fff;font-size:23px;font-weight:900;display:flex;align-items:center;justify-content:center}

@media(max-width:520px){
  .logo{font-size:37px}
  .quick-icon{width:64px;height:64px}
  .quick-item span{font-size:13px}
  .conversation{grid-template-columns:68px 1fr auto;padding:16px 14px}
  .avatar{width:62px;height:62px}
  .conv-name{font-size:18px}
  .preview{font-size:15px}
  .order-card{grid-template-columns:110px 1fr auto;margin:12px}
  .order-card img{width:110px;height:110px}
  .bubble-wrap{max-width:80%}
}
</style>
</head>
<body>
<div class="app">

<section class="screen active" id="listScreen">
  <header class="top">
    <div class="top-row">
      <div class="logo">AliMarket</div>
      <button class="user-btn" onclick="location.href='usuario.html'"><i class="fa-regular fa-user"></i></button>
    </div>
    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="searchMessages" type="text" placeholder="Buscar mensajes">
    </div>
  </header>

  <section class="quick">
    <div class="quick-item" data-action="notifications"><div class="quick-icon"><i class="fa-solid fa-bullhorn"></i></div><span>Notificaciones</span></div>
    <div class="quick-item" onclick="location.href='pedidos.html'"><div class="quick-icon"><i class="fa-solid fa-bag-shopping"></i></div><span>Pedidos</span></div>
    <div class="quick-item"><div class="quick-icon"><i class="fa-solid fa-dollar-sign"></i></div><span>Ofertas</span></div>
    <div class="quick-item"><div class="quick-icon"><i class="fa-solid fa-headset"></i></div><span>Atención</span></div>
  </section>

  <div class="conversation-list" id="conversationList"></div>
</section>

<section class="screen" id="chatScreen">
  <header class="chat-header">
    <button id="backChat"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="chat-title"><h2 id="chatStore">Tienda TrendyShop</h2><div class="online">En línea</div></div>
    <button><i class="fa-solid fa-store"></i></button>
  </header>

  <div class="order-card">
    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=85" alt="Smartwatch">
    <div><h3>Smartwatch Deportivo</h3><div class="order-price">RD$ 2,850</div><div class="order-code">Pedido #12345</div></div>
    <i class="fa-solid fa-chevron-right"></i>
  </div>

  <main class="chat-body" id="chatBody"></main>

  <div class="chat-input">
    <button id="attachBtn"><i class="fa-solid fa-paperclip"></i></button>
    <input id="messageInput" type="text" placeholder="Escribe un mensaje...">
    <button class="send" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
</section>

<section class="screen" id="notificationsScreen">
  <header class="notifications-header">
    <button id="backNotifications"><i class="fa-solid fa-chevron-left"></i></button>
    <h2>Notificaciones</h2>
    <button onclick="location.href='usuario.html'"><i class="fa-regular fa-user"></i></button>
  </header>
  <div id="notificationsList"></div>
</section>

</div>

<nav class="bottom">
  <a href="index.html"><i class="fa-solid fa-house"></i><span>Inicio</span></a>
  <a href="mensajes.html" class="active"><i class="fa-solid fa-comment-dots"></i><span>Mensajes</span></a>
  <a href="#" class="discount">20%</a>
  <a href="carrito.html"><i class="fa-solid fa-cart-shopping"></i><span>Cesta</span></a>
  <a href="usuario.html"><i class="fa-regular fa-user"></i><span>Usuario</span></a>
</nav>

<script>
const CHAT_KEY='alimarketChatTrendy';
const conversations=[
 {type:'choice',name:'AliMarket Oficial',preview:'¡Bienvenido a AliMarket! 👋 Ofertas exclusivas para ti.',time:'09:30',badge:2,verified:true},
 {type:'person',name:'Tienda TrendyShop',preview:'Hola, tu pedido #12345 ha sido enviado. Aquí tienes el número...',time:'Ayer',badge:1,chat:true},
 {type:'mi',name:'Xiaomi Store',preview:'¡Hola! ¿Te gustó el producto que compraste? Tu opinión es...',time:'2 días',badge:1},
 {type:'person2',name:'Fashion House',preview:'Gracias por tu compra. 😃 Si necesitas ayuda, estamos...',time:'3 días'},
 {type:'bell',name:'Notificaciones',preview:'Nueva promoción: Hasta 70% de descuento en productos...',time:'4 días',badge:3,notifications:true},
 {type:'support',name:'Centro de Atención',preview:'Tu ticket #98765 ha sido actualizado.',time:'5 días'}
];
const notices=[
 {icon:'fa-bullhorn',title:'Nueva promoción',text:'Hasta 70% de descuento en productos seleccionados. ¡No te lo pierdas!',time:'Hace 2 horas'},
 {icon:'fa-coins',title:'Monedas',text:'Has recibido 20 monedas AliMarket por tu última compra.',time:'Hace 1 día'},
 {icon:'fa-truck',title:'Envío actualizado',text:'Tu pedido #12345 está en camino. Fecha estimada: 20/05/2025',time:'Hace 1 día'},
 {icon:'fa-bell',title:'Mensaje del vendedor',text:'Tienda TrendyShop te envió un nuevo mensaje sobre tu pedido.',time:'Hace 2 días'},
 {icon:'fa-ticket',title:'Cupón disponible',text:'Tienes un nuevo cupón de 10% de descuento. ¡Úsalo ahora!',time:'Hace 3 días'},
 {icon:'fa-shield-halved',title:'Seguridad',text:'Se ha iniciado sesión en tu cuenta desde un nuevo dispositivo.',time:'Hace 5 días'}
];
const defaultChat=[
 {from:'seller',text:'Hola, tu pedido #12345 ha sido enviado. Aquí tienes el número de seguimiento:\n\nRD123456789DO\n\nPuedes rastrear tu pedido en el enlace: rastrear pedido',time:'Ayer 10:15'},
 {from:'me',text:'¡Excelente! Muchas gracias 😊\n¿Cuánto tiempo tarda en llegar?',time:'Ayer 10:20'},
 {from:'seller',text:'De 3 a 5 días hábiles. Te avisaremos cuando esté cerca de tu dirección.',time:'Ayer 10:22'},
 {from:'me',text:'Perfecto, estaré atento. Gracias 🙏',time:'Ayer 10:23'}
];

const listScreen=document.getElementById('listScreen');
const chatScreen=document.getElementById('chatScreen');
const notificationsScreen=document.getElementById('notificationsScreen');

function showScreen(screen){
  [listScreen,chatScreen,notificationsScreen].forEach(s=>s.classList.remove('active'));
  screen.classList.add('active');
  window.scrollTo(0,0);
}
function avatarHTML(type){
  if(type==='choice')return '<div class="avatar choice">Choice</div>';
  if(type==='mi')return '<div class="avatar mi">mi</div>';
  if(type==='bell')return '<div class="avatar bell"><i class="fa-solid fa-bell"></i></div>';
  if(type==='support')return '<div class="avatar support"><i class="fa-solid fa-headset"></i></div>';
  const url=type==='person2'
    ?'https://api.dicebear.com/9.x/personas/svg?seed=Fashion'
    :'https://api.dicebear.com/9.x/personas/svg?seed=Trendy';
  return `<div class="avatar"><img src="${url}" alt=""></div>`;
}
function renderConversations(filter=''){
  const q=filter.trim().toLowerCase();
  const filtered=conversations.filter(c=>(c.name+' '+c.preview).toLowerCase().includes(q));
  document.getElementById('conversationList').innerHTML=filtered.map((c,i)=>`
    <article class="conversation" data-name="${c.name}">
      ${avatarHTML(c.type)}
      <div>
        <div class="conv-name">${c.name}${c.verified?'<i class="fa-solid fa-circle-check verified"></i>':''}</div>
        <div class="preview">${c.preview}</div>
      </div>
      <div class="conv-side">${c.time}${c.badge?`<div class="badge">${c.badge}</div>`:''}</div>
    </article>
  `).join('');
  document.querySelectorAll('.conversation').forEach(card=>{
    card.onclick=()=>{
      const c=conversations.find(x=>x.name===card.dataset.name);
      if(c.chat){document.getElementById('chatStore').textContent=c.name;showScreen(chatScreen);renderChat();}
      else if(c.notifications)showScreen(notificationsScreen);
    };
  });
}
function getChat(){
  try{
    const saved=JSON.parse(localStorage.getItem(CHAT_KEY)||'null');
    return Array.isArray(saved)?saved:defaultChat;
  }catch(e){return defaultChat}
}
function saveChat(messages){localStorage.setItem(CHAT_KEY,JSON.stringify(messages))}
function renderChat(){
  const body=document.getElementById('chatBody');
  const messages=getChat();
  body.innerHTML=messages.map(m=>`
    <div class="msg-row ${m.from==='me'?'me':''}">
      ${m.from==='seller'?'<div class="msg-avatar"><img src="https://api.dicebear.com/9.x/personas/svg?seed=Trendy"></div>':''}
      <div class="bubble-wrap">
        <div class="bubble">${m.text}</div>
        <div class="msg-time">${m.time}${m.from==='me'?' ✓✓':''}</div>
      </div>
    </div>
  `).join('');
  setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50);
}
function sendMessage(){
  const input=document.getElementById('messageInput');
  const text=input.value.trim();
  if(!text)return;
  const messages=getChat();
  messages.push({from:'me',text,time:new Date().toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'})});
  saveChat(messages);
  input.value='';
  renderChat();
  setTimeout(()=>{
    const updated=getChat();
    updated.push({from:'seller',text:'Gracias por tu mensaje. Te responderemos en breve.',time:new Date().toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'})});
    saveChat(updated);
    renderChat();
  },900);
}
function renderNotifications(){
  document.getElementById('notificationsList').innerHTML=notices.map(n=>`
    <article class="notice">
      <div class="notice-icon"><i class="fa-solid ${n.icon}"></i></div>
      <div><h3>${n.title}</h3><p>${n.text}</p><small>${n.time}</small></div>
      <span class="dot"></span>
    </article>
  `).join('');
}

document.getElementById('searchMessages').addEventListener('input',e=>renderConversations(e.target.value));
document.querySelector('[data-action="notifications"]').onclick=()=>showScreen(notificationsScreen);
document.getElementById('backChat').onclick=()=>showScreen(listScreen);
document.getElementById('backNotifications').onclick=()=>showScreen(listScreen);
document.getElementById('sendBtn').onclick=sendMessage;
document.getElementById('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
document.getElementById('attachBtn').onclick=()=>alert('Aquí puedes conectar un selector de archivos o imágenes.');

renderConversations();
renderNotifications();
</script>
</body>
</html>
